# Separate Cloud Build pipeline for GPU Worker Dockerfile & Cloud Run GPU Jobs
# Usage:
#   gcloud builds submit --config infra/cloudbuild.gpu.yaml .

substitutions:
  _REGION: us-central1
  _AR_REPO: narasimha8780
  _TAG: v1
  _BUCKET: ai-models

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - id: build-gpu-worker
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/gpu-worker:${_TAG}
      - ./gpu-worker

  - id: push-gpu-worker
    name: gcr.io/cloud-builders/docker
    waitFor: [build-gpu-worker]
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/gpu-worker:${_TAG}

  - id: deploy-gpu-image-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor: [push-gpu-worker]
    args:
      - run
      - jobs
      - deploy
      - ai-image-worker
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/gpu-worker:${_TAG}
      - --region=${_REGION}
      - --service-account=ai-gpu-job@${PROJECT_ID}.iam.gserviceaccount.com
      - --cpu=4
      - --memory=16Gi
      - --gpu=1
      - --gpu-type=nvidia-l4
      - --no-gpu-zonal-redundancy
      - --tasks=1
      - --parallelism=1
      - --max-retries=1
      - --task-timeout=3600
      - --set-env-vars=GCP_PROJECT_ID=${PROJECT_ID},GCS_BUCKET=${_BUCKET}

  - id: deploy-gpu-video-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor: [push-gpu-worker]
    args:
      - run
      - jobs
      - deploy
      - ai-video-worker
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/gpu-worker:${_TAG}
      - --region=${_REGION}
      - --service-account=ai-gpu-job@${PROJECT_ID}.iam.gserviceaccount.com
      - --cpu=4
      - --memory=16Gi
      - --gpu=1
      - --gpu-type=nvidia-l4
      - --no-gpu-zonal-redundancy
      - --tasks=1
      - --parallelism=1
      - --max-retries=1
      - --task-timeout=3600
      - --set-env-vars=GCP_PROJECT_ID=${PROJECT_ID},GCS_BUCKET=${_BUCKET}

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/gpu-worker:${_TAG}
